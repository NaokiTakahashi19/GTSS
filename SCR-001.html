<!DOCTYPE html>
<html class="light" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ログイン - 学力定着支援サービス</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6",
                        "primary-dark": "#1d4ed8",
                        "primary-light": "#eff6ff",
                        "secondary": "#8b5cf6",
                        "background-light": "#f8fafc",
                        "text-main": "#1e293b",
                        "text-sub": "#64748b",
                        "accent-success": "#10b981",
                        "card-bg": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans JP", "sans-serif"],
                        "sans": ["Noto Sans JP", "Lexend", "sans-serif"],
                    },
                    borderRadius: {
                        "xl": "1rem",
                        "2xl": "1.5rem",
                    },
                    boxShadow: {
                        'soft': '0 4px 25px -2px rgba(0, 0, 0, 0.06)',
                        'glow': '0 0 20px rgba(59, 130, 246, 0.2)',
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Noto Sans JP', 'Lexend', sans-serif;
        }
        .bg-login-gradient {
            background: radial-gradient(circle at top left, #eff6ff 0%, #ffffff 50%, #f0fdf4 100%);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
    </style>
<style>
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-login-gradient flex flex-col items-center justify-center p-6 text-text-main">
<div class="w-full max-w-[400px] flex flex-col items-center gap-10">
<div class="text-center">
<div class="relative inline-block mb-4">
<div class="absolute -inset-1 bg-gradient-to-br from-primary to-accent-success rounded-2xl blur-md opacity-20"></div>
<div class="relative bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
<span class="material-symbols-outlined text-primary text-[40px] leading-none">auto_stories</span>
</div>
</div>
<h1 class="text-xs font-bold text-primary tracking-[0.2em]">学力定着支援サービス</h1>
</div>
<div class="w-full bg-white rounded-2xl shadow-soft border border-slate-100/60 p-8">
<form action="SCR-002.html" class="flex flex-col gap-6">
<div class="space-y-2">
<label class="text-[13px] font-bold text-slate-600 ml-1" for="student_id">生徒ID（またはメールアドレス）</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">person</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-slate-400 font-medium" id="student_id" placeholder="IDまたはアドレスを入力" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-[13px] font-bold text-slate-600 ml-1" for="password">パスワード</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-slate-400 font-medium" id="password" placeholder="パスワードを入力" type="password"/>
</div>
</div>
<div class="flex items-center justify-end -mt-2">
<a class="text-xs font-bold text-primary hover:text-primary-dark transition-colors" href="#">パスワードを忘れた方はこちら</a>
</div>
<button class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
<span>ログインして学習を始める</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
</div>

</body></html>
